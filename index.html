<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快晴チェック - ひまわり衛星画像</title>
  <meta name="description" content="気象衛星ひまわりの直近5時間の画像で、このあと晴れが続くかを確認するページ">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0e1a;--panel:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.12);--text:#f0f4ff;--text2:#9aa4bf;--text3:#5b6588;--sun:#f59e0b;--blue:#38bdf8}
    html{-webkit-text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto;padding-bottom:32px}
    .title{font-size:0.95rem;font-weight:700;padding:10px 12px 8px;color:var(--sun)}

    /* 衛星画像: スマホ縦画面でも左右いっぱいに表示する */
    .sat-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#111827;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
    .sat-wrap.dragging{cursor:grabbing}
    #satCanvas{display:block;width:100%;height:100%}
    .time-badge{position:absolute;top:8px;left:8px;padding:4px 10px 5px;border-radius:8px;background:rgba(10,14,26,0.72);pointer-events:none;line-height:1.15}
    .time-main{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0.02em}
    .time-sub{font-size:0.72rem;color:var(--text2);font-variant-numeric:tabular-nums}
    .time-sub.latest{color:var(--sun)}

    .panel{padding:0 12px}
    /* スライダー: .meter が指の反応範囲で、線（.meter-inner）より左右に20px広い。
       つまみが端にあるとき、丸の外側半分を触っても反応させるため */
    .meter{height:52px;margin:4px 4px 0;padding:0 20px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
    .meter-inner{position:relative;height:100%}
    .meter-track{position:absolute;left:0;right:0;top:23px;height:6px;border-radius:3px;background:rgba(255,255,255,0.10)}
    .meter-fill{position:absolute;left:0;top:23px;height:6px;border-radius:3px;background:var(--sun);width:0}
    .meter-ticks{position:absolute;left:0;right:0;top:11px;height:30px;display:flex;justify-content:space-between;pointer-events:none}
    .tick{width:2px;height:8px;margin-top:11px;background:rgba(255,255,255,0.12);border-radius:1px}
    .tick.loaded{background:rgba(255,255,255,0.45)}
    .tick.hour{height:16px;margin-top:7px}
    .meter-thumb{position:absolute;top:14px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;border:3px solid var(--sun);left:0;pointer-events:none}
    .meter-labels{margin:0 24px;user-select:none;-webkit-user-select:none;display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text2);font-variant-numeric:tabular-nums}

    .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
    button,select{font-family:inherit;font-size:0.85rem;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
    button:disabled{opacity:0.5;cursor:not-allowed}
    select option{color:#111}
    .seg{display:inline-flex}
    .seg button{border-radius:0;border-left-width:0}
    .seg button:first-child{border-radius:10px 0 0 10px;border-left-width:1px}
    .seg button:last-child{border-radius:0 10px 10px 0}
    .seg button.active{background:var(--sun);color:#3b2504;border-color:var(--sun);font-weight:700}
    .status{margin-top:10px;font-size:0.78rem;color:var(--text2);min-height:1.2em}
    .status.error{color:#fca5a5}
    .legend{margin-top:6px;font-size:0.75rem;color:var(--text2);display:none}
    .legend.show{display:block}
    .hint{margin-top:6px;font-size:0.72rem;color:var(--text3)}

    .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
    .links a{color:var(--blue);text-decoration:none;font-size:0.82rem;border:1px solid var(--border);border-radius:10px;padding:9px 14px;background:var(--panel)}
    .footer{margin-top:28px;font-size:0.72rem;color:var(--text3);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
    .footer a{color:var(--text2)}
    .footer button{min-height:32px;font-size:0.72rem;color:var(--text2);padding:0 10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">⛰️ 快晴チェック</h1>

    <div class="sat-wrap" id="satWrap">
      <canvas id="satCanvas" width="768" height="432"></canvas>
      <div class="time-badge">
        <div class="time-main" id="timeMain">--:--</div>
        <div class="time-sub" id="timeSub">読み込み中…</div>
      </div>
    </div>

    <div class="panel">
      <div class="meter" id="meter">
        <div class="meter-inner" id="meterInner">
          <div class="meter-track"></div>
          <div class="meter-fill" id="meterFill"></div>
          <div class="meter-ticks" id="meterTicks"></div>
          <div class="meter-thumb" id="meterThumb"></div>
        </div>
      </div>
      <div class="meter-labels">
        <span id="labelStart">--:--</span>
        <span id="labelEnd">--:--</span>
      </div>

      <div class="controls">
        <button type="button" id="btnPlay">▶ 再生</button>
        <select id="speedSelect" aria-label="再生速度">
          <option value="800">遅い</option>
          <option value="400" selected>普通</option>
          <option value="200">速い</option>
        </select>
        <div class="seg" role="group" aria-label="画像の種類">
          <button type="button" data-mode="ir" class="active">赤外</button>
          <button type="button" data-mode="vis">可視</button>
          <button type="button" data-mode="mix">合成</button>
        </div>
        <button type="button" id="btnRefresh">🔄 更新</button>
        <button type="button" id="btnLocate">📍 現在地</button>
        <button type="button" id="btnResetView">表示リセット</button>
      </div>
      <div class="status" id="status"></div>
      <div class="legend" id="legend">合成の色: ピンク＝低い雲 / 青＝薄くて高い雲 / 白＝厚い雲。夜の部分は赤外のみ（白黒）で表示します。</div>
      <div class="hint">オレンジの十字が登録地点。ホイール/ピンチで拡大縮小（縮小すると中国沿岸まで見えます）、ドラッグで移動。</div>

      <div class="links">
        <a href="https://www.jma.go.jp/bosai/map.html#contents=himawari" target="_blank" rel="noopener">🏛️ 気象庁</a>
        <a href="https://weathernews.jp/onebox/satellite/" target="_blank" rel="noopener">📺 ウェザーニュース</a>
      </div>

      <footer class="footer">
        <span>衛星画像・海岸線: <a href="https://www.jma.go.jp/" target="_blank" rel="noopener">気象庁</a> ひまわり</span>
        <button type="button" id="btnResetLoc">初期位置に戻す</button>
      </footer>
    </div>
  </div>

  <script>
    'use strict';

    // ── 設定 ──
    const SAT_BASE = 'https://www.jma.go.jp/bosai/himawari/data/satimg';
    const TIMES_URL = `${SAT_BASE}/targetTimes_fd.json`;
    const COAST_BASE = 'https://www.jma.go.jp/tile/jma/sat';
    const ZOOM = 5;
    const TILE_SZ = 256;
    // ズーム5のタイル: x=26〜28 が東経112.5〜146.25度、y=12〜13 が北緯約41〜22度
    const TILE_X_MIN = 26, TILE_Y_MIN = 12, COLS = 3, ROWS = 2;
    const WORLD_W = COLS * TILE_SZ, WORLD_H = ROWS * TILE_SZ;
    // 画面に見せる範囲（論理座標）。横は全幅、縦は16:9に収まる分だけ
    const VIEW_W = WORLD_W, VIEW_H = WORLD_W * 9 / 16;
    const TILES = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) TILES.push({ x: TILE_X_MIN + c, y: TILE_Y_MIN + r });

    const BANDS = { ir: 'B13/TBB', vis: 'B03/ALBD' };
    const FRAME_COUNT = 30;            // 5時間 × 10分間隔
    const LOAD_CONCURRENCY = 4;        // 同時に読み込むコマ数
    const AUTO_REFRESH_MS = 5 * 60 * 1000;
    const WAKE_REFRESH_MS = 2 * 60 * 1000;
    const RETRY_MAX = 5, RETRY_BASE_MS = 3000;
    const MAX_SCALE = 6;
    // 開いたときの表示: 2倍に拡大し、登録地点を左から62%・上から45%の位置に置く（西側を広く見せる）
    const HOME_SCALE = 2, HOME_X = 0.62, HOME_Y = 0.45;
    const DEFAULT_LOC = { lat: 34.9869, lon: 135.6867 };
    const LOC_KEY = 'kaisei.location';

    // 合成画像の調整値
    const MIX_IR_LOW = 0.30, MIX_IR_GAIN = 1 / 0.55;   // 赤外の「雲なし」を暗く落とすための伸長
    const SUN_NIGHT = Math.sin(-2 * Math.PI / 180);    // これ以下は夜（赤外のみ）
    const SUN_DAY = Math.sin(8 * Math.PI / 180);       // これ以上は昼（合成）

    // ── 状態 ──
    const state = {
      mode: 'ir',
      list: [],          // [{basetime, validtime}] 古い順
      idx: 0,
      playing: false,
      playTimer: null,
      speed: 400,
      runId: 0,          // 読み込みの世代。更新・モード切替で進め、古い読み込みを止める
      refreshing: false,
      retryCount: 0,
      retryTimer: null,
      lastOk: 0,
      loc: loadLocation(),
    };
    const view = { s: 1, ox: 0, oy: 0 };
    const tileCache = new Map();   // `${band}|${validtime}` → { tiles, done, failed, promise }
    const mixCache = new Map();    // validtime → canvas（合成済み）
    const coastTiles = [];         // 海岸線の重ね合わせ（1回だけ読み込む）

    const $ = (id) => document.getElementById(id);
    const canvas = $('satCanvas');
    const ctx = canvas.getContext('2d');

    // ── 位置 ──
    function loadLocation() {
      try {
        const raw = localStorage.getItem(LOC_KEY);
        if (raw) {
          const v = JSON.parse(raw);
          if (Number.isFinite(v.lat) && Number.isFinite(v.lon)) return { lat: v.lat, lon: v.lon };
        }
      } catch (e) { /* 保存領域が使えない・壊れている場合は初期位置を使う */ }
      return { ...DEFAULT_LOC };
    }

    function saveLocation(loc) {
      try { localStorage.setItem(LOC_KEY, JSON.stringify(loc)); return true; }
      catch (e) { return false; }
    }

    function latLonToWorld(lat, lon) {
      const n = Math.pow(2, ZOOM);
      const xf = (lon + 180) / 360 * n;
      const rad = lat * Math.PI / 180;
      const yf = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
      return { x: (xf - TILE_X_MIN) * TILE_SZ, y: (yf - TILE_Y_MIN) * TILE_SZ };
    }

    // ── 時刻 ──
    function parseUtc(ts) {
      return Date.UTC(+ts.slice(0, 4), +ts.slice(4, 6) - 1, +ts.slice(6, 8), +ts.slice(8, 10), +ts.slice(10, 12), +ts.slice(12, 14));
    }
    const pad2 = (n) => String(n).padStart(2, '0');
    function jstParts(ms) {
      const d = new Date(ms + 9 * 3600 * 1000);
      return { md: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`, hm: `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`, min: d.getUTCMinutes() };
    }
    function agoText(ms) {
      const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
      if (m < 60) return `${m}分前`;
      return `${Math.floor(m / 60)}時間${m % 60}分前`;
    }

    // ── 表示状態 ──
    function setStatus(text, isError) {
      const el = $('status');
      el.textContent = text;
      el.classList.toggle('error', !!isError);
    }

    function frameReady(mode, entry) {
      if (mode === 'mix') return mixCache.has(entry.validtime);
      const set = tileCache.get(`${BANDS[mode]}|${entry.validtime}`);
      return !!(set && set.done);
    }

    function updateProgress() {
      const ticks = $('meterTicks').children;
      let ready = 0;
      state.list.forEach((e, i) => {
        const ok = frameReady(state.mode, e);
        if (ok) ready++;
        if (ticks[i]) ticks[i].classList.toggle('loaded', ok);
      });
      if (!state.list.length) return;
      if (ready < state.list.length) setStatus(`読み込み中 ${ready} / ${state.list.length}`);
      else setStatus(`最終更新 ${jstParts(state.lastOk).hm}`);
    }

    function buildTimeline() {
      const box = $('meterTicks');
      box.textContent = '';
      for (const e of state.list) {
        const t = document.createElement('div');
        t.className = 'tick' + (jstParts(parseUtc(e.validtime)).min === 0 ? ' hour' : '');
        box.appendChild(t);
      }
      if (state.list.length) {
        $('labelStart').textContent = jstParts(parseUtc(state.list[0].validtime)).hm;
        $('labelEnd').textContent = jstParts(parseUtc(state.list[state.list.length - 1].validtime)).hm + '（最新）';
      }
    }

    function updateTimeUi() {
      const n = state.list.length;
      if (!n) return;
      const pct = n > 1 ? state.idx / (n - 1) * 100 : 100;
      $('meterFill').style.width = pct + '%';
      $('meterThumb').style.left = pct + '%';

      const entry = state.list[state.idx];
      const ms = parseUtc(entry.validtime);
      const p = jstParts(ms);
      const isLatest = state.idx === n - 1;
      $('timeMain').textContent = p.hm;
      const sub = $('timeSub');
      const ready = frameReady(state.mode, entry);
      sub.textContent = ready ? `${p.md} ・ ${agoText(ms)}${isLatest ? ' ・ 最新' : ''}` : `${p.md} ・ 読み込み中…`;
      sub.classList.toggle('latest', ready && isLatest);
    }

    // ── 描画 ──
    function resizeCanvas() {
      const rect = $('satWrap').getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const h = Math.max(1, Math.round(rect.width * dpr * VIEW_H / VIEW_W));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      draw();
    }

    function homeView() {
      const w = latLonToWorld(state.loc.lat, state.loc.lon);
      view.s = HOME_SCALE;
      view.ox = VIEW_W * HOME_X - w.x * view.s;
      view.oy = VIEW_H * HOME_Y - w.y * view.s;
      clampView();
    }

    function clampView() {
      view.s = Math.max(1, Math.min(MAX_SCALE, view.s));
      view.ox = Math.min(0, Math.max(VIEW_W - WORLD_W * view.s, view.ox));
      view.oy = Math.min(0, Math.max(VIEW_H - WORLD_H * view.s, view.oy));
    }

    // 画像座標 → 画面のピクセル。タイルの継ぎ目に隙間が出ないよう整数に丸める
    function toDevice(wx, wy) {
      const k = canvas.width / VIEW_W;
      return { x: Math.round((wx * view.s + view.ox) * k), y: Math.round((wy * view.s + view.oy) * k) };
    }

    function drawTiles(tiles) {
      for (const t of tiles) {
        if (!t.img) continue;
        const col = t.x - TILE_X_MIN, row = t.y - TILE_Y_MIN;
        const a = toDevice(col * TILE_SZ, row * TILE_SZ);
        const b = toDevice((col + 1) * TILE_SZ, (row + 1) * TILE_SZ);
        ctx.drawImage(t.img, a.x, a.y, b.x - a.x, b.y - a.y);
      }
    }

    function drawCrosshair() {
      const w = latLonToWorld(state.loc.lat, state.loc.lon);
      const p = toDevice(w.x, w.y);
      if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) return;
      const u = canvas.width / $('satWrap').getBoundingClientRect().width || 1;  // CSS 1px あたりの画素数
      ctx.save();
      ctx.lineWidth = 2 * u;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 13 * u, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(249,115,22,0.95)';
      ctx.beginPath();
      ctx.moveTo(p.x - 12 * u, p.y); ctx.lineTo(p.x - 4 * u, p.y);
      ctx.moveTo(p.x + 4 * u, p.y); ctx.lineTo(p.x + 12 * u, p.y);
      ctx.moveTo(p.x, p.y - 12 * u); ctx.lineTo(p.x, p.y - 4 * u);
      ctx.moveTo(p.x, p.y + 4 * u); ctx.lineTo(p.x, p.y + 12 * u);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const entry = state.list[state.idx];
      if (entry && frameReady(state.mode, entry)) {
        if (state.mode === 'mix') {
          const a = toDevice(0, 0), b = toDevice(WORLD_W, WORLD_H);
          ctx.drawImage(mixCache.get(entry.validtime), a.x, a.y, b.x - a.x, b.y - a.y);
        } else {
          drawTiles(tileCache.get(`${BANDS[state.mode]}|${entry.validtime}`).tiles);
        }
      }
      drawTiles(coastTiles);
      drawCrosshair();
      updateTimeUi();
    }

    // ── 読み込み ──
    function loadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function loadTileSet(band, entry) {
      const key = `${band}|${entry.validtime}`;
      let set = tileCache.get(key);
      if (set) return set.promise;
      set = { tiles: [], done: false, failed: false, promise: null };
      set.promise = Promise.all(TILES.map(async (t) => {
        const img = await loadImage(`${SAT_BASE}/${entry.basetime}/fd/${entry.validtime}/${band}/${ZOOM}/${t.x}/${t.y}.jpg`);
        return { x: t.x, y: t.y, img };
      })).then((tiles) => {
        set.tiles = tiles;
        set.failed = tiles.some((t) => !t.img);
        set.done = true;
        return set;
      });
      tileCache.set(key, set);
      return set.promise;
    }

    async function loadCoast() {
      const tiles = await Promise.all(TILES.map(async (t) => ({ x: t.x, y: t.y, img: await loadImage(`${COAST_BASE}/${ZOOM}/${t.x}/${t.y}.png`) })));
      coastTiles.length = 0;
      coastTiles.push(...tiles);
      draw();
    }

    // ── 合成（可視＝明るさ、赤外＝色） ──
    const scratch = [0, 1].map(() => {
      const c = document.createElement('canvas');
      c.width = WORLD_W; c.height = WORLD_H;
      return c.getContext('2d', { willReadFrequently: true });
    });

    function readPixels(sctx, tiles) {
      sctx.fillStyle = '#000';
      sctx.fillRect(0, 0, WORLD_W, WORLD_H);
      for (const t of tiles) {
        if (t.img) sctx.drawImage(t.img, (t.x - TILE_X_MIN) * TILE_SZ, (t.y - TILE_Y_MIN) * TILE_SZ);
      }
      return sctx.getImageData(0, 0, WORLD_W, WORLD_H).data;
    }

    // 太陽高度の正弦 = rowA[y] + rowB[y] * colC[x] の形で、行・列ごとに前計算する
    function sunTerms(utcMs) {
      const d = new Date(utcMs);
      const dayOfYear = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 86400000;
      const decl = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI * (dayOfYear + 10) / 365);
      const b = 2 * Math.PI * (dayOfYear - 81) / 364;
      const eotMin = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
      const utcHours = d.getUTCHours() + d.getUTCMinutes() / 60 + eotMin / 60;
      const n = Math.pow(2, ZOOM);
      const rowA = new Float32Array(WORLD_H), rowB = new Float32Array(WORLD_H), colC = new Float32Array(WORLD_W);
      for (let y = 0; y < WORLD_H; y++) {
        const yf = TILE_Y_MIN + (y + 0.5) / TILE_SZ;
        const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * yf / n)));
        rowA[y] = Math.sin(lat) * Math.sin(decl);
        rowB[y] = Math.cos(lat) * Math.cos(decl);
      }
      for (let x = 0; x < WORLD_W; x++) {
        const lon = (TILE_X_MIN + (x + 0.5) / TILE_SZ) / n * 360 - 180;
        colC[x] = Math.cos(((utcHours - 12) * 15 + lon) * Math.PI / 180);
      }
      return { rowA, rowB, colC };
    }

    function composeMix(entry, irSet, visSet) {
      const ir = readPixels(scratch[0], irSet.tiles);
      const vis = readPixels(scratch[1], visSet.tiles);
      const out = new ImageData(WORLD_W, WORLD_H);
      const o = out.data;
      const { rowA, rowB, colC } = sunTerms(parseUtc(entry.validtime));
      const span = SUN_DAY - SUN_NIGHT;
      for (let y = 0; y < WORLD_H; y++) {
        for (let x = 0; x < WORLD_W; x++) {
          const i = (y * WORLD_W + x) * 4;
          const t = ir[i] / 255;
          const v = (vis[i] + vis[i + 1] + vis[i + 2]) / 765;
          // 昼夜の重み（0=夜: 赤外の白黒, 1=昼: 合成色）
          let w = (rowA[y] + rowB[y] * colC[x] - SUN_NIGHT) / span;
          w = w <= 0 ? 0 : w >= 1 ? 1 : w * w * (3 - 2 * w);
          let ts = (t - MIX_IR_LOW) * MIX_IR_GAIN;
          ts = ts <= 0 ? 0 : ts >= 1 ? 1 : ts;
          // 昼の色: 低い雲（可視だけ明るい）はピンク、薄く高い雲（赤外だけ明るい）は青、両方明るい厚い雲は白
          const greenDay = v * 0.55 + ts * 0.45;
          const blueDay = ts > v * 0.6 ? ts : v * 0.6;
          o[i] = (t + (v - t) * w) * 255;
          o[i + 1] = (t + (greenDay - t) * w) * 255;
          o[i + 2] = (t + (blueDay - t) * w) * 255;
          o[i + 3] = 255;
        }
      }
      const c = document.createElement('canvas');
      c.width = WORLD_W; c.height = WORLD_H;
      c.getContext('2d').putImageData(out, 0, 0);
      return c;
    }

    async function prepareFrame(mode, entry) {
      if (mode !== 'mix') { await loadTileSet(BANDS[mode], entry); return; }
      if (mixCache.has(entry.validtime)) return;
      const [irSet, visSet] = await Promise.all([loadTileSet(BANDS.ir, entry), loadTileSet(BANDS.vis, entry)]);
      if (!mixCache.has(entry.validtime)) mixCache.set(entry.validtime, composeMix(entry, irSet, visSet));
    }

    // 最新のコマから順に読み込む。開いた直後に最新が見られるようにするため
    function pump() {
      const runId = ++state.runId;
      const mode = state.mode;
      const queue = state.list.slice().reverse();
      const worker = async () => {
        while (queue.length && runId === state.runId) {
          const entry = queue.shift();
          try { await prepareFrame(mode, entry); }
          catch (e) { console.error('コマの読み込みに失敗', entry.validtime, e); }
          if (runId !== state.runId) return;
          updateProgress();
          if (state.list[state.idx] === entry) draw();
        }
      };
      updateProgress();
      for (let i = 0; i < LOAD_CONCURRENCY; i++) worker();
    }

    function pruneCaches() {
      const alive = new Set(state.list.map((e) => e.validtime));
      for (const [key, set] of tileCache) {
        const vt = key.slice(key.indexOf('|') + 1);
        // 範囲外のコマと、一部のタイルが欠けたコマ（取り直す）を捨てる
        if (!alive.has(vt) || (set.done && set.failed)) {
          tileCache.delete(key);
          if (set.done && set.failed) mixCache.delete(vt);
        }
      }
      for (const vt of mixCache.keys()) if (!alive.has(vt)) mixCache.delete(vt);
    }

    async function fetchTimes() {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      try {
        const res = await fetch(TIMES_URL, { cache: 'no-store', signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const all = await res.json();
        const list = Array.isArray(all) ? all.filter((e) => e && /^\d{14}$/.test(e.basetime) && /^\d{14}$/.test(e.validtime)) : [];
        if (!list.length) throw new Error('時刻リストが空です');
        return list.slice(-FRAME_COUNT);
      } finally { clearTimeout(timer); }
    }

    async function refresh() {
      if (state.refreshing) return;
      state.refreshing = true;
      clearTimeout(state.retryTimer);
      $('btnRefresh').disabled = true;
      try {
        const list = await fetchTimes();
        const old = state.list;
        const wasLatest = !old.length || state.idx === old.length - 1;
        const currentVt = old.length ? old[state.idx].validtime : null;
        state.list = list;
        const same = list.findIndex((e) => e.validtime === currentVt);
        state.idx = (wasLatest || same < 0) ? list.length - 1 : same;
        state.lastOk = Date.now();
        state.retryCount = 0;
        pruneCaches();
        buildTimeline();
        draw();
        pump();
      } catch (e) {
        // 失敗しても表示中の画像はそのまま残し、間隔を空けてやり直す
        const reason = e.name === 'AbortError' ? 'タイムアウト' : e.message;
        if (state.retryCount < RETRY_MAX) {
          state.retryCount++;
          setStatus(`更新に失敗しました（${reason}）。再試行します ${state.retryCount} / ${RETRY_MAX}`, true);
          state.retryTimer = setTimeout(refresh, RETRY_BASE_MS * state.retryCount);
        } else {
          state.retryCount = 0;
          setStatus(`更新に失敗しました（${reason}）。「更新」を押してください`, true);
        }
      } finally {
        state.refreshing = false;
        $('btnRefresh').disabled = false;
      }
    }

    // ── 再生 ──
    function stopPlay() {
      state.playing = false;
      clearTimeout(state.playTimer);
      state.playTimer = null;
      $('btnPlay').textContent = '▶ 再生';
    }

    function playStep() {
      const n = state.list.length;
      if (!state.playing || !n) return;
      // 読み込み済みの次のコマへ進む（未読み込みは飛ばす）
      for (let step = 1; step <= n; step++) {
        const next = (state.idx + step) % n;
        if (frameReady(state.mode, state.list[next])) { state.idx = next; break; }
      }
      draw();
      // 最新のコマでは少し長く止める
      const hold = state.idx === n - 1 ? state.speed * 3 : state.speed;
      state.playTimer = setTimeout(playStep, hold);
    }

    function togglePlay() {
      if (state.playing) { stopPlay(); return; }
      state.playing = true;
      $('btnPlay').textContent = '⏸ 一時停止';
      state.playTimer = setTimeout(playStep, state.speed);
    }

    // ── 操作 ──
    function setMode(mode) {
      if (mode === state.mode) return;
      state.mode = mode;
      document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
      $('legend').classList.toggle('show', mode === 'mix');
      draw();
      pump();
    }

    function eventToView(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * VIEW_W / rect.width, y: (e.clientY - rect.top) * VIEW_H / rect.height };
    }

    function zoomAt(point, nextScale) {
      const old = view.s;
      const s = Math.max(1, Math.min(MAX_SCALE, nextScale));
      if (s === old) return;
      view.ox = point.x - (point.x - view.ox) * s / old;
      view.oy = point.y - (point.y - view.oy) * s / old;
      view.s = s;
      clampView();
      draw();
    }

    function setupMapGestures() {
      const wrap = $('satWrap');
      const pointers = new Map();
      let lastPan = null, lastPinch = 0;
      const pts = () => Array.from(pointers.values());
      const pinchDist = () => { const p = pts(); return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
      const pinchCenter = () => { const p = pts(); return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; };

      wrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomAt(eventToView(e), view.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
      }, { passive: false });

      wrap.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        pointers.set(e.pointerId, eventToView(e));
        wrap.setPointerCapture(e.pointerId);
        wrap.classList.add('dragging');
        lastPan = pointers.size === 1 ? eventToView(e) : null;
        lastPinch = pointers.size === 2 ? pinchDist() : 0;
      });

      wrap.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        const p = eventToView(e);
        pointers.set(e.pointerId, p);
        if (pointers.size === 2) {
          const d = pinchDist();
          if (lastPinch > 0) zoomAt(pinchCenter(), view.s * d / lastPinch);
          lastPinch = d;
          lastPan = null;
          return;
        }
        if (lastPan) {
          view.ox += p.x - lastPan.x;
          view.oy += p.y - lastPan.y;
          clampView();
          draw();
        }
        lastPan = p;
      });

      const end = (e) => {
        pointers.delete(e.pointerId);
        lastPinch = pointers.size === 2 ? pinchDist() : 0;
        lastPan = pointers.size === 1 ? pts()[0] : null;
        if (!pointers.size) wrap.classList.remove('dragging');
      };
      wrap.addEventListener('pointerup', end);
      wrap.addEventListener('pointercancel', end);
      wrap.addEventListener('dragstart', (e) => e.preventDefault());
    }

    function setupMeter() {
      const meter = $('meter');
      let dragging = false;
      const seek = (e) => {
        const n = state.list.length;
        if (!n) return;
        const rect = $('meterInner').getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const idx = Math.round(pct * (n - 1));
        if (idx !== state.idx) { state.idx = idx; draw(); }
      };
      meter.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        // 既定動作（文字の選択やドラッグ＆ドロップ）が始まると操作が打ち切られるので止める
        e.preventDefault();
        dragging = true;
        meter.setPointerCapture(e.pointerId);
        if (state.playing) stopPlay();
        seek(e);
      });
      meter.addEventListener('pointermove', (e) => { if (dragging) seek(e); });
      const end = () => { dragging = false; };
      meter.addEventListener('pointerup', end);
      meter.addEventListener('pointercancel', end);
      meter.addEventListener('dragstart', (e) => e.preventDefault());
    }

    function locate() {
      if (!navigator.geolocation || !window.isSecureContext) {
        setStatus('このページの開き方では現在地を取得できません（HTTPS または localhost で開く必要があります）', true);
        return;
      }
      const btn = $('btnLocate');
      btn.disabled = true;
      navigator.geolocation.getCurrentPosition(
        (p) => {
          btn.disabled = false;
          state.loc = { lat: p.coords.latitude, lon: p.coords.longitude };
          const saved = saveLocation(state.loc);
          homeView();
          draw();
          setStatus(saved ? '現在地を登録しました（次回からこの地点を表示します）' : '現在地を表示しました（このブラウザでは保存できませんでした）', !saved);
        },
        () => {
          // 失敗時は登録済みの地点をそのまま使う
          btn.disabled = false;
          setStatus('現在地を取得できませんでした。登録済みの地点のまま表示します', true);
        },
        { timeout: 10000 }
      );
    }

    function resetLocation() {
      try { localStorage.removeItem(LOC_KEY); } catch (e) { /* 保存領域が使えなくても表示は戻す */ }
      state.loc = { ...DEFAULT_LOC };
      homeView();
      draw();
      setStatus('初期位置に戻しました');
    }

    // ── 初期化 ──
    function init() {
      setupMapGestures();
      setupMeter();
      $('btnPlay').addEventListener('click', togglePlay);
      $('speedSelect').addEventListener('change', (e) => { state.speed = parseInt(e.target.value, 10) || 400; });
      document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      $('btnRefresh').addEventListener('click', () => { state.retryCount = 0; refresh(); });
      $('btnLocate').addEventListener('click', locate);
      $('btnResetView').addEventListener('click', () => { homeView(); draw(); });
      $('btnResetLoc').addEventListener('click', resetLocation);

      homeView();
      new ResizeObserver(resizeCanvas).observe($('satWrap'));
      resizeCanvas();

      // スリープ復帰・画面に戻ったとき・回線が戻ったときに取り直す
      const stale = (ms) => Date.now() - state.lastOk > ms;
      document.addEventListener('visibilitychange', () => { if (!document.hidden && stale(WAKE_REFRESH_MS)) refresh(); });
      window.addEventListener('online', () => refresh());
      setInterval(() => {
        if (!document.hidden && stale(AUTO_REFRESH_MS)) refresh();
        else if (state.list.length) updateTimeUi();   // 「○分前」の表示を進める
      }, 60 * 1000);

      loadCoast();
      refresh();
    }

    init();
  </script>
</body>
</html>
